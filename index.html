<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveitor by tizonsoft</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f5;
        }
        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: #18181b;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }
        h1 span {
            font-size: 0.875rem;
            font-weight: 400;
            color: #71717a;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #d4d4d8;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .output {
            padding: 1rem;
            background: #f4f4f5;
            border-radius: 4px;
            min-height: 24px;
            word-break: break-all;
            font-size: 1rem;
            color: #3f3f46;
            margin-bottom: 1.5rem;
        }
        footer {
            text-align: center;
            font-size: 0.875rem;
            color: #71717a;
            border-top: 1px solid #f4f4f5;
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reveitor <span>by tizonsoft</span></h1>
        <input type="text" id="inputString" placeholder="Introduce el texto..." autofocus>
        <div id="outputString" class="output"></div>
        <footer>
            made with 🧠 Tizón
        </footer>
    </div>

    <script>
        const inputString = document.getElementById('inputString');
        const outputString = document.getElementById('outputString');

        inputString.addEventListener('input', (e) => {
            outputString.textContent = e.target.value.split('').reverse().join('');
        });
    </script>
</body>
</html>
